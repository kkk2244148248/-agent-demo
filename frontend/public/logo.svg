<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="海贸工作台">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#134E42"/>
      <stop offset="0.55" stop-color="#0C3B33"/>
      <stop offset="1" stop-color="#082B25"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C56A"/>
      <stop offset="1" stop-color="#C2932F"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FD8C8"/>
      <stop offset="1" stop-color="#4FB3A0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#1D6B5C" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0C3B33" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底板 -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>

  <!-- 金色日轮（贸易地平线） -->
  <circle cx="256" cy="196" r="74" fill="url(#gold)"/>
  <circle cx="256" cy="196" r="74" fill="none" stroke="#F7E3AE" stroke-opacity="0.55" stroke-width="3"/>

  <!-- 三道海浪 -->
  <path d="M96 300
           C 136 276, 176 276, 216 300
           S 296 324, 336 300
           S 416 276, 436 292"
        fill="none" stroke="url(#wave)" stroke-width="22" stroke-linecap="round"/>
  <path d="M120 358
           C 156 336, 192 336, 228 358
           S 304 380, 340 358
           S 400 338, 416 350"
        fill="none" stroke="url(#wave)" stroke-width="18" stroke-linecap="round" stroke-opacity="0.72"/>
  <path d="M150 412
           C 182 394, 214 394, 246 412
           S 314 430, 346 412
           S 392 396, 404 406"
        fill="none" stroke="url(#wave)" stroke-width="14" stroke-linecap="round" stroke-opacity="0.42"/>
</svg>
