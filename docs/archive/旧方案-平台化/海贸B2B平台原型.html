<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>海贸 HaiMao · B2B出海撮合平台 · 高保真原型</title>
<style>
:root{
  --bg:#f4f6f9;
  --panel:#ffffff;
  --panel-2:#fafbfc;
  --line:#e3e7ee;
  --line-2:#eef1f6;
  --text:#151a22;
  --text-2:#444d5c;
  --muted:#7c8798;
  --brand:#0b5cff;
  --brand-d:#0a4bd1;
  --brand-l:#eaf1ff;
  --accent:#ff6a00;
  --accent-l:#fff2e8;
  --ok:#12a150;
  --ok-l:#e8f8ef;
  --warn:#c97706;
  --warn-l:#fff7e6;
  --danger:#dc2626;
  --danger-l:#fdeeee;
  --gold:#b7791f;
  --gold-l:#fdf6e3;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
  --shadow-lg:0 10px 40px rgba(16,24,40,.14);
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cfd6e0;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:50;height:58px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:18px;padding:0 20px;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:.2px;white-space:nowrap}
.brand .logo{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;
  background:linear-gradient(135deg,#0b5cff,#00b3ff);
}
.brand small{display:block;font-weight:500;font-size:10px;color:var(--muted);letter-spacing:1.4px;margin-top:-3px}
.seg{display:flex;background:#f0f3f8;border-radius:9px;padding:3px;gap:2px}
.seg button{
  padding:7px 15px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text-2);
  display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s;
}
.seg button:hover{color:var(--text)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(16,24,40,.1)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.whoami{display:flex;align-items:center;gap:9px;padding:5px 11px 5px 6px;background:#f5f7fb;border-radius:999px;font-size:12.5px}
.whoami .av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#0b5cff,#5b8dff);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.whoami .org{color:var(--muted);font-size:11px}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{padding:5px 10px;font-size:12px;color:var(--muted);font-weight:600}
.lang button.on{background:var(--brand-l);color:var(--brand)}

/* ============ 子导航 ============ */
.subbar{
  position:sticky;top:58px;z-index:49;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:4px;padding:0 20px;height:46px;overflow-x:auto;
}
.subbar button{
  padding:6px 12px;border-radius:8px;font-size:13px;color:var(--text-2);white-space:nowrap;font-weight:500;transition:.15s;
}
.subbar button:hover{background:#f4f6fa;color:var(--text)}
.subbar button.on{background:var(--brand);color:#fff;font-weight:600}
.subbar .divider{width:1px;height:20px;background:var(--line);margin:0 8px}

/* ============ 布局 ============ */
.main{padding:20px 20px 60px;max-width:1440px;margin:0 auto}
.row{display:flex;gap:16px}
.col{flex:1;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card-h h3{margin:0;font-size:14px;font-weight:700}
.card-h .more{margin-left:auto;font-size:12.5px;color:var(--muted)}
.card-b{padding:16px}
.card-b.tight{padding:10px}
.card-b.none{padding:0}

.page-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-h h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px}
.page-h p{margin:0;color:var(--muted);font-size:13px}
.page-h .actions{margin-left:auto;display:flex;gap:9px}

/* ============ 通用元件 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 15px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid transparent;transition:.15s;white-space:nowrap;
}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d)}
.btn.acc{background:var(--accent);color:#fff}
.btn.acc:hover{filter:brightness(.94)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--text-2)}
.btn.ghost:hover{border-color:#c3ccdb;color:var(--text)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:7px}
.btn.lg{padding:11px 22px;font-size:14.5px;border-radius:9px}
.btn.block{width:100%}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:#fff;border-color:#f2c4c4;color:var(--danger)}
.btn.danger:hover{background:var(--danger-l)}

.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600;line-height:1.7;white-space:nowrap}
.tag.b{background:var(--brand-l);color:var(--brand)}
.tag.o{background:var(--accent-l);color:#c25200}
.tag.g{background:var(--ok-l);color:#0b7d3e}
.tag.w{background:var(--warn-l);color:var(--warn)}
.tag.r{background:var(--danger-l);color:var(--danger)}
.tag.gold{background:var(--gold-l);color:var(--gold)}
.tag.gray{background:#f1f3f7;color:var(--text-2)}
.tag.line{background:#fff;border:1px solid var(--line);color:var(--text-2)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;background:#f2f4f8;color:var(--text-2);font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.bold{font-weight:700}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.price{color:var(--accent);font-weight:800}
.blue{color:var(--brand)}
.green{color:var(--ok)}
.red{color:var(--danger)}
hr{border:none;border-top:1px solid var(--line-2);margin:14px 0}
.spacer{flex:1}
.nowrap{white-space:nowrap}

table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.4px;
  padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap;text-transform:uppercase;
}
td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover{background:#fafbfe}
tbody tr:last-child td{border-bottom:none}

.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.field label .req{color:var(--danger)}
.inp,select.inp,textarea.inp{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none;transition:.15s;
}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,92,255,.1)}
textarea.inp{resize:vertical;min-height:74px;line-height:1.6}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}

.kpi{padding:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:5px}
.kpi .val{font-size:25px;font-weight:800;margin:6px 0 2px;letter-spacing:-.6px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
.kpi .sub{font-size:11.5px;color:var(--muted)}
.kpi.brand{background:linear-gradient(135deg,#0b5cff,#2a7bff);border-color:transparent}
.kpi.brand .lab,.kpi.brand .sub{color:rgba(255,255,255,.82)}
.kpi.brand .val{color:#fff}

.bar{height:7px;border-radius:4px;background:#eef1f6;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--brand);transition:width .6s}
.bar i.o{background:var(--accent)}
.bar i.g{background:var(--ok)}
.bar i.r{background:var(--danger)}

.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:6px;top:5px;bottom:5px;width:2px;background:var(--line)}
.tl .node{position:relative;padding-bottom:17px}
.tl .node:last-child{padding-bottom:0}
.tl .node:before{
  content:"";position:absolute;left:-22px;top:4px;width:11px;height:11px;border-radius:50%;
  background:#fff;border:2.5px solid var(--line);box-sizing:border-box;
}
.tl .node.done:before{background:var(--ok);border-color:var(--ok)}
.tl .node.now:before{background:var(--brand);border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-l)}
.tl .node .tt{font-weight:600;font-size:13px}
.tl .node .dd{font-size:11.5px;color:var(--muted)}

.thumbs{display:flex;gap:7px}
.ph{
  border-radius:9px;background:#f2f5fa;border:1px solid var(--line-2);display:grid;place-items:center;
  font-size:24px;overflow:hidden;position:relative;
}
.ph.a{background:linear-gradient(135deg,#eef3ff,#dfe9ff)}
.ph.b{background:linear-gradient(135deg,#fff3e8,#ffe3cc)}
.ph.c{background:linear-gradient(135deg,#e9f8f1,#d5f1e4)}
.ph.d{background:linear-gradient(135deg,#f5eefe,#e9dcfb)}
.ph.e{background:linear-gradient(135deg,#fdeef2,#fbdde6)}
.ph.f{background:linear-gradient(135deg,#eef6fb,#dbeaf7)}

.prod-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:.18s;cursor:pointer;display:flex;flex-direction:column}
.prod-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#cfdcf5}
.prod-card .img{height:132px;font-size:44px}
.prod-card .bd{padding:11px 12px 13px;display:flex;flex-direction:column;gap:6px;flex:1}

.sup-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);transition:.18s;cursor:pointer}
.sup-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#cfdcf5}
.sup-card .hd{display:flex;gap:11px;align-items:flex-start}
.sup-card .lg{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:19px;font-weight:800;color:#fff;flex-shrink:0}

.quote-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:#fff;position:relative;transition:.18s}
.quote-card:hover{border-color:#cfdcf5}
.quote-card.best{border:2px solid var(--ok);background:linear-gradient(180deg,#f7fdfa,#fff)}
.quote-card .ribbon{position:absolute;top:-1px;right:14px;background:var(--ok);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:0 0 7px 7px}

.alert{display:flex;gap:11px;padding:12px 14px;border-radius:9px;font-size:12.5px;line-height:1.6;align-items:flex-start}
.alert .ic{font-size:15px;flex-shrink:0;line-height:1.4}
.alert.info{background:var(--brand-l);color:#0a3f9e}
.alert.ok{background:var(--ok-l);color:#0b6b37}
.alert.warn{background:var(--warn-l);color:#8a5200}
.alert.danger{background:var(--danger-l);color:#a01c1c}
.alert.agent{background:linear-gradient(135deg,#f2f0ff,#eaf2ff);color:#3b2a8c;border:1px solid #ddd8ff}

.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--text-2);cursor:pointer;transition:.15s}
.chip:hover{border-color:#c3ccdb}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}

.side-filter{position:sticky;top:124px}
.side-filter h4{font-size:12.5px;margin:0 0 8px;font-weight:700;color:var(--text-2)}
.fgroup{padding:11px 0;border-bottom:1px solid var(--line-2)}
.fgroup:last-child{border-bottom:none}

.progress-steps{display:flex;gap:0;margin:6px 0 18px;flex-wrap:wrap}
.pstep{flex:1;min-width:88px;text-align:center;position:relative;padding-top:30px;font-size:11.5px;color:var(--muted)}
.pstep:before{
  content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:23px;height:23px;border-radius:50%;background:#eef1f6;color:var(--muted);
  display:grid;place-items:center;font-size:11px;font-weight:700;z-index:2;
}
.pstep:after{content:"";position:absolute;top:11px;left:50%;width:100%;height:2.5px;background:#eef1f6;z-index:1}
.pstep:last-child:after{display:none}
.pstep.done:before{background:var(--ok);color:#fff}
.pstep.done:after{background:var(--ok)}
.pstep.now:before{background:var(--brand);color:#fff;box-shadow:0 0 0 4px var(--brand-l)}
.pstep.now{color:var(--brand);font-weight:700}
.pstep.done{color:var(--ok)}

/* 聊天 / Agent 面板 */
.agent-fab{
  position:fixed;right:22px;bottom:22px;z-index:60;width:52px;height:52px;border-radius:16px;
  background:linear-gradient(135deg,#0b5cff,#6a3cff);color:#fff;font-size:22px;display:grid;place-items:center;
  box-shadow:0 8px 26px rgba(11,92,255,.4);transition:.2s;
}
.agent-fab:hover{transform:scale(1.07)}
.agent-panel{
  position:fixed;right:22px;bottom:86px;z-index:60;width:390px;max-height:66vh;background:#fff;
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);display:none;flex-direction:column;overflow:hidden;
}
.agent-panel.on{display:flex}
.agent-panel .ah{padding:12px 15px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:9px;background:linear-gradient(135deg,#f7f9ff,#f2f0ff)}
.agent-panel .ab{padding:13px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:11px}
.msg{max-width:90%;padding:9px 12px;border-radius:11px;font-size:12.5px;line-height:1.62}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:#f4f6fa;border-bottom-left-radius:3px}
.msg.a b{color:var(--brand)}
.agent-panel .af{padding:10px;border-top:1px solid var(--line-2)}
.agent-panel .af input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;outline:none}

.banner{
  border-radius:14px;padding:26px 30px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(120deg,#0b3fbf 0%,#0b5cff 45%,#00a3ff 100%);
}
.banner:after{
  content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;
  background:rgba(255,255,255,.09);
}
.banner:before{
  content:"";position:absolute;right:70px;bottom:-90px;width:190px;height:190px;border-radius:50%;
  background:rgba(255,255,255,.06);
}
.banner h2{margin:0 0 7px;font-size:23px;font-weight:800;position:relative;letter-spacing:-.3px}
.banner p{margin:0 0 18px;opacity:.9;font-size:13.5px;position:relative;max-width:640px}
.searchbox{position:relative;display:flex;background:#fff;border-radius:11px;padding:5px;gap:5px;max-width:660px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.searchbox input{flex:1;border:none;outline:none;padding:10px 13px;font-size:14px;background:transparent}
.searchbox select{border:none;outline:none;background:#f4f6fa;border-radius:8px;padding:0 10px;font-size:13px;color:var(--text-2)}
.hotwords{position:relative;margin-top:13px;font-size:12.5px;opacity:.9;display:flex;gap:14px;flex-wrap:wrap}
.hotwords b{font-weight:600;opacity:.75;font-weight:500}
.hotwords span{cursor:pointer;border-bottom:1px dashed rgba(255,255,255,.5)}

.cat-tile{
  background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px 12px;text-align:center;
  cursor:pointer;transition:.15s;box-shadow:var(--shadow)
}
.cat-tile:hover{transform:translateY(-3px);border-color:#cfdcf5;box-shadow:var(--shadow-lg)}
.cat-tile .em{font-size:25px;display:block;margin-bottom:6px}
.cat-tile .nm{font-size:12.5px;font-weight:600}
.cat-tile .ct{font-size:11px;color:var(--muted)}

.funnel{display:flex;flex-direction:column;gap:9px}
.funnel .frow{display:flex;align-items:center;gap:11px}
.funnel .flab{width:96px;font-size:12.5px;color:var(--text-2);text-align:right;flex-shrink:0}
.funnel .fbar{flex:1;height:26px;border-radius:7px;background:#f0f3f8;overflow:hidden;position:relative}
.funnel .fbar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#0b5cff,#3c85ff)}
.funnel .fbar span{position:absolute;left:11px;top:0;line-height:26px;font-size:11.5px;font-weight:700;color:#fff}
.funnel .fval{width:82px;font-size:12px;color:var(--muted);text-align:right;flex-shrink:0}

.rate{display:flex;gap:2px;font-size:12px;color:#f5a623;align-items:center}
.rate .n{color:var(--text-2);font-weight:700;margin-left:4px;font-size:12px}

.notice{
  display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--warn-l);border:1px solid #f6e0b0;
  border-radius:9px;font-size:12.5px;color:#8a5200;
}
.steps-num{display:flex;gap:0;margin-bottom:18px}
.snum{flex:1;display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted)}
.snum i{width:22px;height:22px;border-radius:50%;background:#eef1f6;display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:700;flex-shrink:0}
.snum.on{color:var(--brand);font-weight:700}
.snum.on i{background:var(--brand);color:#fff}
.foot{text-align:center;color:var(--muted);font-size:11.5px;padding:26px 0 8px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   海贸 B2B 撮合平台 · 高保真原型
   三端：采购商 buyer / 供应商 supplier / 平台平台 platform
   ===================================================================== */

const S = {
  role:'buyer',
  page:'buyer-home',
  lang:'zh',
  agentOpen:false,
  agentMsgs:[{r:'a',t:'我是海贸智能中枢。你在采购商视角，我可以帮你<b>选供应商</b>、<b>生成比价报告</b>、<b>核对单据</b>。试试问我："帮我看看这 3 家报价谁最合适"。'}],
  filter:{cat:'全部', verified:false, gold:false, fast:false}
};

const ROLES = {
  buyer:{name:'采购商端',icon:'🌎',who:'Emma Lindberg',org:'Nordic Retail Group · 瑞典',short:'NL',
    nav:[['buyer-home','首页'],['buyer-search','找货源'],['buyer-rfq-new','发布询盘 RFQ'],['buyer-rfq-list','我的询盘'],
         ['buyer-quote-compare','报价对比'],['buyer-order','订单与履约'],['buyer-suppliers','我的供应商']]},
  supplier:{name:'供应商端',icon:'🏭',who:'吴经理',org:'义乌星海家居礼品 · 已认证☑',short:'星',

/* ---------------- Agent 悬浮助手 ---------------- */
function agentPanelHtml(){
  return `
  <div class="agent-panel ${S.agentOpen?'on':''}" id="agentPanel">
    <div class="ah">
      <div style="width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#0b5cff,#6a3cff);color:#fff;display:grid;place-items:center;font-size:14px">🤖</div>
      <div style="flex:1"><div class="bold" style="font-size:13px">海贸智能中枢</div><div class="tiny muted">当前身份：${ROLES[S.role].name} · 数据边界已隔离</div></div>
      <button class="btn ghost sm" onclick="toggleAgent()">✕</button>
    </div>
    <div class="ab" id="agentBody">
      ${S.agentMsgs.map(m=>`<div class="msg ${m.r}">${m.t}</div>`).join('')}
    </div>
    <div class="af">
      <div style="display:flex;gap:6px;margin-bottom:7px;flex-wrap:wrap">
        ${quickAsks().map(q=>`<span class="chip" style="font-size:11px;padding:3px 9px" onclick="askAgent('${q.replace(/'/g,'')}')">${q}</span>`).join('')}
      </div>
      <div style="display:flex;gap:7px"><input placeholder="问点什么，如：这 3 家报价谁最合适？" onkeydown="if(event.key==='Enter')askAgent(this.value)"><button class="btn pri sm" onclick="askAgent(this.previousElementSibling.value)">发送</button></div>
    </div>
  </div>`;
}
function quickAsks(){
  if(S.role==='buyer') return ['这 3 家报价谁最合适？','帮我看看交期能不能赶上','这家供应商靠谱吗'];
  if(S.role==='supplier') return ['帮我写英文报价','这个价我该不该接','我的信用分怎么提'];
  return ['今天有什么异常？','哪类目供给不足','这批入驻风险大吗'];
}
function askAgent(q){
  if(!q||!q.trim()) return;
  S.agentMsgs.push({r:'u',t:q});
  const ans = {
    buyer:'已为你分析 RFQ-20261016-0117 的 3 家报价：<b>宁波盛达（US$4.05 / 18天 / 已验厂 / 信用分4.7）综合最优</b>。永康恒久单价最低但交期 28 天，赶不上你的 11-20 大货窗口。<br><br>需要我生成一份<b>正式比价报告 PDF</b> 发给你的团队吗？',
    supplier:'已根据你的价目表与买家需求生成报价草稿：<b>US$4.05/pc FOB 宁波，MOQ 500，交期 18 天</b>，并附上 FDA / BSCI / ISO9001 资质。<br><br>提示：这个买家历史付款及时性 98%，属优质客户，建议 3 小时内回复（你有 88% 的 24h 响应率，保持住可以冲击金牌供应商）。',
    platform:'今日 5 条预警中 2 条高风险：<br>① 永康恒久报价低于类目均价 36%，疑似钓鱼报价；<br>② 一份 SGS 证书同时挂在 3 家供应商名下。<br><br>另外「数码」类目 24h 报价率降至 54%，已跌破 60% 警戒线，建议定向邀请 20 家具备 UN38.3 的供应商入驻。'
  }[S.role];
  S.agentMsgs.push({r:'a',t:ans});
  S.agentOpen=true; renderAgent();
  setTimeout(()=>{const b=$('#agentBody'); if(b) b.scrollTop=b.scrollHeight;},30);
}
function renderAgent(){
  const el=$('#agentPanel');
  if(el){ el.outerHTML=agentPanelHtml(); }
  else document.body.insertAdjacentHTML('beforeend',agentPanelHtml());
  const b=$('#agentBody'); if(b) b.scrollTop=b.scrollHeight;
}
