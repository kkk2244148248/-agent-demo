<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>海贸 · 业务员跑单工作台 · 高保真原型</title>
<style>
:root{
  /* 底色 */
  --bg:#edf2f0; --bg-2:#e4ebe8; --panel:#fff; --panel-2:#f7faf9; --panel-3:#eef4f2;
  --line:#dfe7e4; --line-2:#eef3f1; --line-3:#cfdbd7;
  /* 文字 */
  --text:#0f1a1f; --text-2:#3b4d55; --muted:#6b7d85; --faint:#97a8ae;
  /* 品牌：墨绿 */
  --brand:#0d5c4f; --brand-d:#0a463c; --brand-l:#e2f2ed; --brand-2:#138b77;
  /* 强调：暖金 */
  --accent:#b8802a; --accent-l:#fdf4e2;
  /* 语义 */
  --ok:#1c7a45; --ok-l:#e6f5ec; --warn:#b06a12; --warn-l:#fdf1e2;
  --danger:#bf3b2f; --danger-l:#fdecea; --gold:#a9781f; --gold-l:#fbf3df;
  --info:#2f6ea8; --info-l:#eaf2f9;
  /* 阴影 */
  --shadow-xs:0 1px 2px rgba(15,26,31,.05);
  --shadow:0 1px 2px rgba(15,26,31,.05),0 6px 18px -8px rgba(15,26,31,.16);
  --shadow-lg:0 18px 44px -20px rgba(15,26,31,.32);
  --r:13px; --r-sm:9px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--text);font-size:13.5px;line-height:1.62;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 460px at 6% -10%,#dcf0e9 0%,transparent 58%),
    radial-gradient(880px 400px at 102% -4%,#e5eef5 0%,transparent 52%),
    var(--bg);
  background-attachment:fixed}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
::selection{background:#bfe4da;color:#08322a}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c6d4d0;border:3px solid transparent;background-clip:content-box;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#a9bdb7;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ 顶栏 ============ */
.topbar{position:sticky;top:0;z-index:50;height:60px;background:rgba(255,255,255,.88);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:18px;padding:0 22px;box-shadow:0 1px 0 rgba(15,26,31,.02)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;white-space:nowrap;letter-spacing:-.01em}
.brand .logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;
  background:linear-gradient(140deg,#2fb39a,#0d5c4f);box-shadow:0 5px 14px -6px rgba(13,92,79,.85)}
.brand small{display:block;font-weight:600;font-size:9.5px;color:var(--faint);letter-spacing:1.6px;margin-top:-4px}
.seg{display:flex;background:#eef3f1;border-radius:11px;padding:3px;gap:3px}
.seg button{padding:7px 16px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.16s}
.seg button:hover{color:var(--text)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(15,26,31,.12)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.whoami{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;background:#f2f7f5;border-radius:999px;font-size:12.5px;border:1px solid var(--line-2)}
.whoami .av{width:25px;height:25px;border-radius:50%;background:linear-gradient(140deg,#7fdcc9,#2fb39a);color:#06231f;display:grid;place-items:center;font-size:11px;font-weight:800}
.whoami .org{color:var(--muted);font-size:11px}
.clock{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ============ 二级导航 ============ */
.subbar{position:sticky;top:60px;z-index:49;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 22px;height:48px;overflow-x:auto}
.subbar button{padding:7px 13px;border-radius:9px;font-size:13px;color:var(--text-2);white-space:nowrap;font-weight:500;transition:.15s;position:relative}
.subbar button:hover{background:#f0f6f4;color:var(--text)}
.subbar button.on{background:var(--brand);color:#fff;font-weight:650;box-shadow:0 3px 10px -4px rgba(13,92,79,.6)}
.subbar .badge{position:absolute;top:0;right:1px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;
  min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 3px;line-height:1;box-shadow:0 0 0 2px #fff}
.subbar button.on .badge{background:#fff;color:var(--brand)}
.subbar .divider{width:1px;height:20px;background:var(--line);margin:0 8px;flex-shrink:0}

/* ============ 布局 ============ */
.main{padding:22px 22px 76px;max-width:1500px;margin:0 auto}
.row{display:flex;gap:16px}
.col{flex:1;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1150px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.row{flex-direction:column}.g2,.g3,.g4,.g5{grid-template-columns:1fr}}

/* ============ 卡片 ============ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-xs);overflow:hidden}
.card-h{padding:14px 17px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,#fcfefd,#f9fcfb)}
.card-h h3{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em}
.card-h .more{margin-left:auto;font-size:12.5px;color:var(--muted)}
.card-b{padding:17px}
.card-b.none{padding:0}
.page-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.4px}
.page-h p{margin:0;color:var(--muted);font-size:13px}
.page-h .actions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}

/* ============ 按钮 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 15px;border-radius:9px;
  font-size:13px;font-weight:600;border:1px solid transparent;transition:transform .14s,background .14s,box-shadow .14s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;box-shadow:0 2px 8px -3px rgba(13,92,79,.6)}
.btn.pri:hover{background:linear-gradient(180deg,#17a08a,var(--brand-2))}
.btn.acc{background:linear-gradient(180deg,#cb9433,#b8802a);color:#fff}
.btn.acc:hover{filter:brightness(1.05)}
.btn.ghost{background:#fff;border-color:var(--line-3);color:var(--text-2);box-shadow:var(--shadow-xs)}
.btn.ghost:hover{border-color:var(--brand-2);color:var(--brand);background:#f7fbf9}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:#fff;border-color:#f0c8c3;color:var(--danger)}
.btn.danger:hover{background:var(--danger-l)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:8px}
.btn.lg{padding:11px 22px;font-size:14.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

/* ============ 标签 ============ */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:7px;font-size:11.5px;font-weight:650;line-height:1.7;white-space:nowrap}
.tag.b{background:var(--brand-l);color:var(--brand)}.tag.o{background:var(--accent-l);color:#8f6115}
.tag.g{background:var(--ok-l);color:#0f6b39}.tag.w{background:var(--warn-l);color:var(--warn)}
.tag.r{background:var(--danger-l);color:var(--danger)}.tag.gold{background:var(--gold-l);color:var(--gold)}
.tag.gray{background:#f1f4f3;color:var(--text-2)}.tag.line{background:#fff;border:1px solid var(--line);color:var(--text-2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:11.5px;background:#f1f4f3;color:var(--text-2);font-weight:550}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.bold{font-weight:700}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:-.2px}
.price{color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums}
.blue{color:var(--brand)}.green{color:var(--ok)}.red{color:var(--danger)}.orange{color:var(--warn)}
.spacer{flex:1}.nowrap{white-space:nowrap}
hr{border:none;border-top:1px solid var(--line-2);margin:15px 0}

/* ============ 表格 ============ */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{text-align:left;font-weight:700;color:var(--muted);font-size:11px;letter-spacing:.7px;text-transform:uppercase;
  padding:11px 13px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:12px 13px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{transition:background .14s}
tbody tr:hover{background:#f5faf8}
tbody tr:last-child td{border-bottom:none}
td .mono{color:var(--text-2)}

/* ============ 表单 ============ */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:650;color:var(--text-2);margin-bottom:5px}
.field label .req{color:var(--danger)}
.inp{width:100%;padding:9px 12px;border:1px solid var(--line-3);border-radius:9px;background:#fff;outline:none;transition:.15s}
.inp:hover{border-color:#b6c7c2}
.inp:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(19,139,119,.14)}
textarea.inp{resize:vertical;min-height:74px;line-height:1.6}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.55}

/* ============ KPI ============ */
.kpi{padding:17px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-xs);
  position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:550;display:flex;align-items:center;gap:5px}
.kpi .val{font-size:26px;font-weight:800;margin:7px 0 2px;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:13px;font-weight:650;color:var(--muted);margin-left:2px}
.kpi .sub{font-size:11.5px;color:var(--muted)}
.kpi.brand{background:linear-gradient(142deg,#0d5c4f 0%,#12796a 62%,#178c7a 100%);border-color:transparent}
.kpi.brand::after{content:"";position:absolute;right:-34px;top:-44px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.09)}
.kpi.brand .lab,.kpi.brand .sub{color:rgba(255,255,255,.8)}
.kpi.brand .val{color:#fff}
.kpi.danger{background:linear-gradient(142deg,#b8382c 0%,#cf4c3e 100%);border-color:transparent}
.kpi.danger::after{content:"";position:absolute;right:-34px;top:-44px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1)}
.kpi.danger .lab,.kpi.danger .sub{color:rgba(255,255,255,.85)}
.kpi.danger .val{color:#fff}

/* ============ 进度条 ============ */
.bar{height:7px;border-radius:99px;background:var(--panel-3);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .6s}
.bar i.o{background:linear-gradient(90deg,#cb9433,var(--accent))}
.bar i.g{background:linear-gradient(90deg,#1c7a45,#34a866)}
.bar i.r{background:linear-gradient(90deg,#bf3b2f,#d8614f)}
.bar i.w{background:linear-gradient(90deg,#b06a12,#d08a25)}

/* ============ 时间线 ============ */
.tl{position:relative;padding-left:25px}
.tl:before{content:"";position:absolute;left:6px;top:5px;bottom:5px;width:2px;background:var(--line-3);border-radius:2px}
.tl .node{position:relative;padding-bottom:17px}
.tl .node:last-child{padding-bottom:0}
.tl .node:before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--line-3);box-sizing:border-box;z-index:1}
.tl .node.done:before{background:var(--ok);border-color:var(--ok)}
.tl .node.now:before{background:var(--brand);border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-l)}
.tl .node.late:before{background:var(--danger);border-color:var(--danger);box-shadow:0 0 0 4px var(--danger-l)}
.tl .node .tt{font-weight:650;font-size:13px}
.tl .node .dd{font-size:11.5px;color:var(--muted)}

/* ============ 提示块 ============ */
.alert{display:flex;gap:11px;padding:12px 15px;border-radius:var(--r-sm);font-size:12.5px;line-height:1.62;align-items:flex-start;position:relative}
.alert .ic{font-size:15px;flex-shrink:0;line-height:1.4}
.alert.info{background:var(--info-l);color:#1f5384;border-left:3px solid var(--info)}
.alert.ok{background:var(--ok-l);color:#0f6b39;border-left:3px solid var(--ok)}
.alert.warn{background:var(--warn-l);color:#8a5200;border-left:3px solid var(--warn)}
.alert.danger{background:var(--danger-l);color:#a01c1c;border-left:3px solid var(--danger)}
.alert.agent{background:linear-gradient(135deg,#f3f1ff,#eaf3fb);color:#37307d;border:1px solid #ded9f7;border-left:3px solid #6f5bd6}

.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line-3);background:#fff;font-size:12.5px;color:var(--text-2);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--brand-2);color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:650;box-shadow:0 3px 10px -4px rgba(13,92,79,.6)}

/* 交期红绿灯 */
.ldot{width:10px;height:10px;border-radius:50%;display:inline-block}
.ldot.g{background:var(--ok);box-shadow:0 0 0 3px var(--ok-l)}
.ldot.w{background:var(--warn);box-shadow:0 0 0 3px var(--warn-l)}
.ldot.r{background:var(--danger);box-shadow:0 0 0 3px var(--danger-l)}

/* 卡片式列表 */
.cust-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow-xs);transition:.18s;cursor:pointer}
.cust-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#c3ddd6}
.sup-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow-xs);transition:.18s;cursor:pointer}
.sup-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#c3ddd6}

.lg{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:17px;font-weight:800;color:#fff;flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}

.ph{border-radius:10px;background:#f2f6f4;border:1px solid var(--line-2);display:grid;place-items:center;overflow:hidden}
.ph.a{background:linear-gradient(135deg,#e9f4f0,#d7ebe4)}
.ph.b{background:linear-gradient(135deg,#fdf3e6,#f8e3c8)}
.ph.c{background:linear-gradient(135deg,#e9f8f1,#d5f1e4)}
.ph.d{background:linear-gradient(135deg,#f2eefe,#e6dcfb)}
.ph.e{background:linear-gradient(135deg,#fdeef2,#fbdde6)}

/* 版本对比 */
.ver{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;margin-bottom:10px;position:relative;transition:.16s}
.ver:hover{border-color:var(--line-3)}
.ver.cur{border:2px solid var(--brand-2);background:linear-gradient(180deg,#f5fbf9,#fff);box-shadow:0 4px 14px -8px rgba(13,92,79,.5)}
.ver.old{opacity:.74}
.diff{font-size:11.5px}
.diff .up{color:var(--danger)}
.diff .down{color:var(--ok)}

/* 毛利条 */
.mbar{height:28px;background:var(--panel-3);border-radius:8px;position:relative;overflow:hidden}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,#1c7a45,#3ec97c);border-radius:8px;transition:width .6s}
.mbar i.bad{background:linear-gradient(90deg,#bf3b2f,#e0705f)}
.mbar .floor{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--danger);z-index:2;box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.mbar .flab{position:absolute;bottom:-19px;font-size:10.5px;color:var(--danger);transform:translateX(-50%);white-space:nowrap;font-weight:700}

/* 步骤 */
.steps-num{display:flex;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.snum{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted)}
.snum i{width:23px;height:23px;border-radius:50%;background:var(--panel-3);display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:700;flex-shrink:0}
.snum.on{color:var(--brand);font-weight:700}
.snum.on i{background:var(--brand);color:#fff;box-shadow:0 3px 8px -3px rgba(13,92,79,.7)}

/* 漏斗 */
.funnel{display:flex;flex-direction:column;gap:10px}
.funnel .frow{display:flex;align-items:center;gap:11px}
.funnel .flab{width:104px;font-size:12.5px;color:var(--text-2);text-align:right;flex-shrink:0}
.funnel .fbar{flex:1;height:27px;border-radius:8px;background:var(--panel-3);overflow:hidden;position:relative}
.funnel .fbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--brand),#2fb39a);transition:width .6s}
.funnel .fbar span{position:absolute;left:11px;top:0;line-height:27px;font-size:11.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.funnel .fval{width:82px;font-size:12px;color:var(--muted);text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}

/* 悬浮助手 */
.agent-fab{position:fixed;right:24px;bottom:24px;z-index:60;width:54px;height:54px;border-radius:17px;
  background:linear-gradient(140deg,#2fb39a,#0d5c4f);color:#fff;font-size:23px;display:grid;place-items:center;
  box-shadow:0 10px 28px -8px rgba(13,92,79,.75);transition:.2s}
.agent-fab:hover{transform:scale(1.08) rotate(-4deg)}
.agent-panel{position:fixed;right:24px;bottom:90px;z-index:60;width:400px;max-height:70vh;background:#fff;
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);display:none;flex-direction:column;overflow:hidden}
.agent-panel.on{display:flex}
.agent-panel .ah{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:9px;
  background:linear-gradient(135deg,#f4fbf9,#f1f6fb)}
.agent-panel .ab{padding:14px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:11px;min-height:130px}
.msg{max-width:92%;padding:10px 13px;border-radius:12px;font-size:12.5px;line-height:1.62}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:#f3f7f6;border-bottom-left-radius:4px}
.msg.a b{color:var(--brand)}
.agent-panel .af{padding:11px;border-top:1px solid var(--line-2)}
.agent-panel .af input{width:100%;padding:9px 12px;border:1px solid var(--line-3);border-radius:9px;outline:none}
.agent-panel .af input:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(19,139,119,.14)}

.foot{text-align:center;color:var(--faint);font-size:11.5px;padding:28px 0 8px}
.note{background:var(--gold-l);border:1px solid #efe0b6;color:#7f5c19;padding:11px 14px;border-radius:var(--r-sm);font-size:12.5px}

/* 今日跑单待办条 */
.task{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border-radius:var(--r-sm);background:var(--panel-2);
  border:1px solid var(--line-2);margin-bottom:9px;transition:.16s;cursor:pointer}
.task:hover{background:#f2f9f6;border-color:#c9e0d9;transform:translateX(2px)}

function go(p){

}

/* ---------------- Agent 助手 ---------------- */
function quickAsks(){
  if(S.role==='wm') return ['今天该干什么','哪张单要延期了','谁还没打钱','这单能赚多少'];
  return ['谁在偷懒','有飞单风险吗','哪单要黄了','本月毛利多少'];
}
function agentPanelHtml(){
  return `
  <div class="agent-panel ${S.agentOpen?'on':''}" id="agentPanel">
    <div class="ah">
      <div style="width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#0d5c4f,#0d5c4f);color:#fff;display:grid;place-items:center;font-size:14px">🤖</div>
      <div style="flex:1"><div class="bold" style="font-size:13px">跑单助理</div><div class="tiny muted">${S.role==='wm'?'业务员视角 · 只看得到你自己的客户':'管理视角 · 全公司数据'}</div></div>
      <button class="btn ghost sm" onclick="toggleAgent()">✕</button>
    </div>
    <div class="ab" id="agentBody">
      ${S.agentMsgs.map(m=>`<div class="msg ${m.r}">${m.t}</div>`).join('')}
    </div>
    <div class="af">
      <div style="display:flex;gap:6px;margin-bottom:7px;flex-wrap:wrap">
        ${quickAsks().map(q=>`<span class="chip" style="font-size:11px;padding:3px 9px" onclick="askAgent('${q}')">${q}</span>`).join('')}
      </div>
      <div style="display:flex;gap:7px"><input placeholder="问我任何跑单问题…" onkeydown="if(event.key==='Enter')askAgent(this.value)"><button class="btn pri sm" onclick="askAgent(this.previousElementSibling.value)">发送</button></div>
    </div>
  </div>`;
}
function askAgent(q){
  if(!q||!q.trim()) return;
  S.agentMsgs.push({r:'u',t:q});
  const ans={
    wm:'今天你的清单：<br><b>① 交期告急</b>：HM-PO-20261014-0031 折叠伞，工厂已延期 5 天，客户 11-05 到货大概率赶不上 —— 建议今天先联系赵经理要赶工方案。<br><b>② 跟进逾期</b>：Sakura Beauty JP 已 32 天没跟，今天不跟就回公海了。<br><b>③ 待审批</b>：2 条报价在经理那边，其中保温杯那条毛利 17.6% 没问题。<br><b>④ 应收款</b>：Gulf Insurance 尾款 US$9,275 逾期 3 天 —— 但先别提钱，先把延期的事情说清楚。',
    mgr:'团队情况：<br><b>① 谁在偷懒</b>：刘敏首响 9.2 小时（团队均值 4.7）、跟进逾期 6 条、客户流失 2 家，建议本周一对一。<br><b>② 飞单风险</b>：王芳报了一单低于底价 8%，毛利率仅 6.2%，已拦在老板特批环节。<br><b>③ 交期风险</b>：李海涛名下折叠伞订单工厂延期 5 天。<br><b>④ 本月毛利</b>：团队 US$133.4K，完成目标 74%，张伟贡献 39%。',
    boss:'老板视角三件事：<br><b>① 谁在干活</b>：张伟最稳（12 单 / US$52.1K 毛利），刘敏需关注（2 单 / 逾期 6 条 / 流失 2 家）。<br><b>② 飞单与客户资产</b>：本月 3 次低于底价报价，全部走特批留痕；客户分布最高集中度 29%，无单点风险。<br><b>③ 赚了多少</b>：团队本月毛利 US$133.4K，毛利率 18.7%，提成合计 ¥12,011。'
  }[S.role];
  S.agentMsgs.push({r:'a',t:ans});
  S.agentOpen=true; renderAgent();
  setTimeout(()=>{const b=$('#agentBody'); if(b) b.scrollTop=b.scrollHeight;},30);
}
function renderAgent(){
  const el=$('#agentPanel');
  if(el) el.outerHTML=agentPanelHtml();
  else document.body.insertAdjacentHTML('beforeend',agentPanelHtml());
  const b=$('#agentBody'); if(b) b.scrollTop=b.scrollHeight;
}
